# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  - push
  - pull_request

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_freefairBuildCachePassword: ${{ secrets.BUILD_CACHE_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21, 25 ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew -V assemble -s
      - run: ./gradlew -V check -s
      - name: Upload Coverage Reports
        run: |
          ./gradlew jacocoTestReport
          bash <(curl -s https://codecov.io/bash)

  build-examples:
    name: Build example projects
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21, 25 ]
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew -V assemble -s
      - run: ./gradlew -V check -s

  # Single stable status check for branch protection. The build jobs use a
  # version matrix, so their check names change whenever the matrix changes —
  # a required context that no longer reports blocks the branch forever.
  build-gate:
    name: build-gate
    runs-on: ubuntu-latest
    needs: [ build, build-examples ]
    if: always()
    steps:
      - name: Verify build results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          EXAMPLES_RESULT: ${{ needs.build-examples.result }}
        run: |
          echo "Build plugin:          $BUILD_RESULT"
          echo "Build example projects: $EXAMPLES_RESULT"
          [ "$BUILD_RESULT" = "success" ] || exit 1
          [ "$EXAMPLES_RESULT" = "success" ] || exit 1
